name: Voice samples (temporary)

on:
  push:
    branches: [tmp-pronunciation-debug]

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip > /dev/null
      - name: Commons (current)
        run: python tools/pronunciation/samples.py commons
      - name: Vosk TTS
        continue-on-error: true
        run: |
          pip install -q vosk-tts
          python tools/pronunciation/samples.py vosk
      - name: utrobinmv VITS
        continue-on-error: true
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers scipy
          python tools/pronunciation/samples.py utrobin
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find samples -type f | sort
          zip -qr ovoz-namunalari.zip samples
          gh release delete voice-samples --cleanup-tag --yes || true
          gh release create voice-samples ovoz-namunalari.zip --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Ovoz namunalari (sinov)" --notes "Talaffuz ovozini tanlash uchun namunalar. Ilova bu release'ni o'qimaydi."
