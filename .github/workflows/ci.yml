name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: tilsim_core (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - working-directory: core
        run: uv run --python 3.14 --no-project --with pytest python -m pytest -q
      - name: translations shipped with the app (merge tool and file)
        run: |
          uv run --python 3.14 --no-project --with pytest python -m pytest -q tools/translations
          uv run --python 3.14 --no-project python tools/translations/merge.py --check
      - name: lexicon matches its OpenCorpora export
        run: >
          uv run --python 3.14 --no-project
          --with pymorphy3==2.0.6 --with pymorphy3-dicts-ru==2.4.417150.4580142 --with wordfreq==3.1.1
          python tools/lexicon/export_opencorpora.py --check

  api:
    name: API (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run --python 3.14 --no-project --with asyncpg --with pytest python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Password hashing with Web Crypto inside Pyodide (as in the Worker)
        run: node --test apps/api/tests/js/webcrypto.test.mjs

  api-worker:
    name: API in the Workers runtime (pywrangler dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tilsim
          POSTGRES_PASSWORD: tilsim
          POSTGRES_DB: tilsim
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://tilsim:tilsim@localhost:5432/tilsim
        run: uv run --no-project --with asyncpg python scripts/migrate.py
      - name: Start the Worker and call it
        working-directory: apps/api
        run: |
          echo "JWT_SECRET=ci-only-secret-0123456789abcdef0123456789" > .dev.vars
          uv sync
          (uv run pywrangler dev --port 8787 > worker.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf http://localhost:8787/health > /dev/null && break
            sleep 4
          done
          set -x
          curl -sf http://localhost:8787/health | tee health.json
          grep -q '"database":"ok"' health.json
          code=$(curl -s -o register.json -w '%{http_code}' -X POST http://localhost:8787/v1/auth/register \
            -H 'content-type: application/json' -H 'origin: http://tauri.localhost' \
            -d '{"email":"ci@example.com","password":"ci-password-123","device":{"id":"6b0f3d9e-3a8f-4f8e-9a51-0c7b2d1e4f60","name":"CI","platform":"browser"}}')
          cat register.json; test "$code" = "201"
          token=$(python3 -c "import json;print(json.load(open('register.json'))['access_token'])")
          curl -sf http://localhost:8787/v1/me -H "authorization: Bearer $token" | tee me.json
          grep -q 'ci@example.com' me.json
          code=$(curl -s -o login.json -w '%{http_code}' -X POST http://localhost:8787/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123","device":{"id":"6b0f3d9e-3a8f-4f8e-9a51-0c7b2d1e4f60","name":"CI","platform":"browser"}}')
          cat login.json; test "$code" = "200"
          refresh=$(python3 -c "import json;print(json.load(open('login.json'))['refresh_token'])")
          code=$(curl -s -o refresh.json -w '%{http_code}' -X POST http://localhost:8787/v1/auth/refresh \
            -H 'content-type: application/json' -d "{\"refresh_token\":\"$refresh\"}")
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"wrong-password","device":{"id":"6b0f3d9e-3a8f-4f8e-9a51-0c7b2d1e4f60","platform":"browser"}}')
          test "$code" = "401"
          curl -s -i -X OPTIONS http://localhost:8787/v1/auth/login -H 'origin: http://tauri.localhost' | grep -i 'access-control-allow-origin: http://tauri.localhost'
          # Sync in the Workers runtime: a large row (50 000 characters) goes up and comes back.
          access=$(python3 -c "import json;print(json.load(open('refresh.json'))['access_token'])")
          python3 - > push.json <<'PY'
          import json, uuid
          t = "2026-11-20T09:00:00.000Z"
          row = {"id": str(uuid.uuid4()), "created_at": t, "updated_at": t, "deleted_at": None, "version": 1,
                 "title": "CI", "body": "Я" * 50000, "source": ""}
          print(json.dumps({"changes": [{"table": "reading_texts", "row": row}]}))
          PY
          curl -sf -X POST http://localhost:8787/v1/sync/push -H 'content-type: application/json' \
            -H "authorization: Bearer $access" --data-binary @push.json | tee pushed.json
          python3 -c "import json;r=json.load(open('pushed.json'));assert len(r['accepted'])==1 and not r['rejected'],r"
          curl -sf "http://localhost:8787/v1/sync/pull?since=0" -H "authorization: Bearer $access" > pulled.json
          python3 -c "import json;r=json.load(open('pulled.json'));assert len(r['changes'])==1 and len(r['changes'][0]['row']['body'])==50000"
          curl -sf http://localhost:8787/v1/account -H "authorization: Bearer $access" | tee account.json
          python3 -c "import json;r=json.load(open('account.json'));assert r['progress']['texts']==1 and r['devices'][0]['current']"
          # Shared translations: the first account is the admin; reading needs no account.
          curl -sf -X POST http://localhost:8787/v1/translations -H 'content-type: application/json' \
            -H "authorization: Bearer $access" \
            -d '{"changes":[{"lexeme_id":"книга|NOUN,inan,femn","lemma":"книга","translation":"kitob","updated_at":"2026-11-20T09:00:00Z","deleted_at":null}]}' | tee tr.json
          python3 -c "import json;r=json.load(open('tr.json'));assert r['accepted']==['книга|NOUN,inan,femn'],r"
          curl -sf "http://localhost:8787/v1/translations?since=0" | grep -q 'kitob'
      - name: Worker log
        if: always()
        working-directory: apps/api
        run: cat worker.log || true

  client:
    name: Client (vue-tsc, build, vitest + Pyodide)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  windows:
    name: Windows app (cargo test + NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - run: npm ci
      - name: Rust tests
        working-directory: apps/client/src-tauri
        run: cargo test --locked
      - name: Build installer
        working-directory: apps/client
        shell: bash
        env:
          # Optional repository secrets for automatic updates (docs/SETUP.md, "Avtomatik
          # yangilanish"). With them the installer gets an updater signature (.sig) and the
          # app trusts the matching public key. Without them updates stay off in this build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node scripts/set-version.mjs "0.1.${{ github.run_number }}"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            CONFIG=$(node -e 'console.log(JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.TAURI_UPDATER_PUBKEY}}}))')
            npx tauri build --config "$CONFIG"
          else
            echo "::warning::Updater keys are not set: this build cannot update itself"
            npx tauri build
          fi
          ls src-tauri/target/release/bundle/nsis
      - uses: actions/upload-artifact@v4
        with:
          name: tilsim-windows-installer
          path: |
            apps/client/src-tauri/target/release/bundle/nsis/*.exe
            apps/client/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  android:
    name: Android app (release APK, arm64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK (the runner already has the Android SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - run: npm ci
      - name: Build APK
        working-directory: apps/client
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ls "$NDK_HOME" > /dev/null
          node scripts/set-version.mjs "0.1.${{ github.run_number }}"
          npx tauri android init --ci
          npx tauri icon ../../brand/tilsim-b.svg -o src-tauri/icons
          npx tauri android build --apk --target aarch64 --target armv7
      - name: Sign APK
        working-directory: apps/client
        env:
          # Optional repository secrets. With them every build has the same signature, so a new
          # APK installs over the old one and keeps the app's data. Without them a throw-away
          # key is made for this build only (the old app must then be removed first).
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "unsigned: $UNSIGNED"; test -n "$UNSIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KEYSTORE_PASSWORD"; ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
            # keytool stores aliases in lower case; a keystore with one key needs no exact alias.
            KEYS=$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" | grep -i 'PrivateKeyEntry' | cut -d, -f1)
            if printf '%s\n' "$KEYS" | grep -qixF "$ALIAS"; then
              ALIAS=$(printf '%s\n' "$KEYS" | grep -ixF "$ALIAS" | head -1)
            else
              if [ "$(printf '%s\n' "$KEYS" | grep -c .)" = "1" ]; then
                echo "::warning::ANDROID_KEY_ALIAS does not match the keystore; using its only key"
                ALIAS="$KEYS"
              else
                echo "::error::ANDROID_KEY_ALIAS is not a key in ANDROID_KEYSTORE_B64"; exit 1
              fi
            fi
            echo "Signing with the repository key"
            mkdir -p ../../dist-android
            # Only APKs signed with the same key can update an installed app (android.json).
            touch ../../dist-android/signed-with-repo-key
          else
            PASS="tilsim-test"; ALIAS="tilsim"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tilsim test build" > /dev/null
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this APK is signed with a one-off key"
          fi
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p ../../dist-android
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --out ../../dist-android/Tilsim-android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose ../../dist-android/Tilsim-android.apk | head -5
          unzip -l ../../dist-android/Tilsim-android.apk | grep 'lib/'
          ls -la ../../dist-android
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: tilsim-android-apk
          path: dist-android/
          if-no-files-found: error

  deploy-api:
    name: Deploy API to Cloudflare (after the tests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, api, api-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    env:
      # Repository secrets (docs/SETUP.md, 5-bo'lim). Until all are set, this job only warns.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Check the deploy secrets
        id: cfg
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HYPERDRIVE_ID DATABASE_URL JWT_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::API not deployed, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.cfg.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply database migrations (Neon)
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/api
        run: uv run --no-project --with asyncpg python scripts/migrate.py
      - name: Deploy the Worker
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          sed -i "s/REPLACE_WITH_HYPERDRIVE_ID/$HYPERDRIVE_ID/" wrangler.jsonc
          uv sync
          uv run pywrangler deploy 2>&1 | tee deploy.log
          # JWT_SECRET is set once; changing it signs every user out.
          if ! npx --yes wrangler@4 secret list 2>/dev/null | grep -q '"JWT_SECRET"'; then
            printf '%s' "$JWT_SECRET" | npx --yes wrangler@4 secret put JWT_SECRET
          fi
      - name: Check the deployed API
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then echo "::warning::workers.dev address not found in the deploy log"; exit 0; fi
          echo "API: $URL"
          for i in $(seq 1 10); do curl -sf "$URL/health" > health.json && break; sleep 3; done
          cat health.json
          grep -q '"database":"ok"' health.json

  publish:
    name: Publish test builds (GitHub Release "dev")
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, api, api-worker, client, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Replace the "dev" pre-release with this commit's builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          BASE="https://github.com/$GH_REPO/releases/download/dev"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOTES="Zabon $VERSION (${GITHUB_SHA::7})"
          mkdir upload
          cp artifacts/tilsim-windows-installer/*.exe upload/Zabon-windows-setup.exe
          cp artifacts/tilsim-android-apk/Tilsim-android.apk upload/Zabon-android.apk
          # Update descriptions (src-tauri/src/update.rs), only for builds that can update.
          SIG=$(ls artifacts/tilsim-windows-installer/*.sig 2>/dev/null | head -1 || true)
          if [ -n "$SIG" ]; then
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg d "$NOW" --arg s "$(cat "$SIG")" --arg u "$BASE/Zabon-windows-setup.exe" \
              '{version: $v, notes: $n, pub_date: $d, platforms: {"windows-x86_64": {signature: $s, url: $u}}}' > upload/latest.json
          fi
          if [ -f artifacts/tilsim-android-apk/signed-with-repo-key ]; then
            jq -n --arg v "$VERSION" --arg n "$NOTES" --arg s "$(sha256sum upload/Zabon-android.apk | cut -d' ' -f1)" --arg u "$BASE/Zabon-android.apk" \
              '{version: $v, notes: $n, sha256: $s, url: $u}' > upload/android.json
          fi
          ls -la upload
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev upload/* --prerelease --target "$GITHUB_SHA" \
            --title "Zabon $VERSION — sinov versiyasi (${GITHUB_SHA::7})" \
            --notes "main branch'ning oxirgi muvaffaqiyatli build'i. Faqat sinov uchun: Windows o'rnatuvchisi imzolanmagan (SmartScreen ogohlantiradi), Android APK release build (arm64 + armv7)."
