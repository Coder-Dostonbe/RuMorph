name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: tilsim_core (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - working-directory: core
        run: uv run --python 3.14 --no-project --with pytest python -m pytest -q

  api:
    name: API (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: uv run --python 3.14 --no-project --with asyncpg --with pytest python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Password hashing with Web Crypto inside Pyodide (as in the Worker)
        run: node --test apps/api/tests/js/webcrypto.test.mjs

  api-worker:
    name: API in the Workers runtime (pywrangler dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tilsim
          POSTGRES_PASSWORD: tilsim
          POSTGRES_DB: tilsim
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://tilsim:tilsim@localhost:5432/tilsim
        run: uv run --no-project --with asyncpg python scripts/migrate.py
      - name: Start the Worker and call it
        working-directory: apps/api
        run: |
          echo "JWT_SECRET=ci-only-secret-0123456789abcdef0123456789" > .dev.vars
          uv sync
          (uv run pywrangler dev --port 8787 > worker.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf http://localhost:8787/health > /dev/null && break
            sleep 4
          done
          set -x
          curl -sf http://localhost:8787/health | tee health.json
          grep -q '"database":"ok"' health.json
          code=$(curl -s -o register.json -w '%{http_code}' -X POST http://localhost:8787/v1/auth/register \
            -H 'content-type: application/json' -H 'origin: http://tauri.localhost' \
            -d '{"email":"ci@example.com","password":"ci-password-123","device":{"id":"6b0f3d9e-3a8f-4f8e-9a51-0c7b2d1e4f60","name":"CI","platform":"browser"}}')
          cat register.json; test "$code" = "201"
          token=$(python3 -c "import json;print(json.load(open('register.json'))['access_token'])")
          curl -sf http://localhost:8787/v1/me -H "authorization: Bearer $token" | tee me.json
          grep -q 'ci@example.com' me.json
          code=$(curl -s -o login.json -w '%{http_code}' -X POST http://localhost:8787/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123","device":{"id":"6b0f3d9e-3a8f-4f8e-9a51-0c7b2d1e4f60","name":"CI","platform":"browser"}}')
          cat login.json; test "$code" = "200"
          refresh=$(python3 -c "import json;print(json.load(open('login.json'))['refresh_token'])")
          code=$(curl -s -o refresh.json -w '%{http_code}' -X POST http://localhost:8787/v1/auth/refresh \
            -H 'content-type: application/json' -d "{\"refresh_token\":\"$refresh\"}")
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"wrong-password","device":{"id":"6b0f3d9e-3a8f-4f8e-9a51-0c7b2d1e4f60","platform":"browser"}}')
          test "$code" = "401"
          curl -s -i -X OPTIONS http://localhost:8787/v1/auth/login -H 'origin: http://tauri.localhost' | grep -i 'access-control-allow-origin: http://tauri.localhost'
      - name: Worker log
        if: always()
        working-directory: apps/api
        run: cat worker.log || true

  client:
    name: Client (vue-tsc, build, vitest + Pyodide)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  windows:
    name: Windows app (cargo test + NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - run: npm ci
      - name: Rust tests
        working-directory: apps/client/src-tauri
        run: cargo test --locked
      - name: Build installer
        working-directory: apps/client
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tilsim-windows-installer
          path: apps/client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android app (release APK, arm64 + armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK (the runner already has the Android SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
      - run: npm ci
      - name: Build APK
        working-directory: apps/client
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ls "$NDK_HOME" > /dev/null
          npx tauri android init --ci
          npx tauri icon ../../brand/tilsim-b.svg -o src-tauri/icons
          npx tauri android build --apk --target aarch64 --target armv7
      - name: Sign APK
        working-directory: apps/client
        env:
          # Optional repository secrets. With them every build has the same signature, so a new
          # APK installs over the old one and keeps the app's data. Without them a throw-away
          # key is made for this build only (the old app must then be removed first).
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "unsigned: $UNSIGNED"; test -n "$UNSIGNED"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
            echo "Signing with the repository key"
          else
            PASS="tilsim-test"; ALIAS="tilsim"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Tilsim test build" > /dev/null
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this APK is signed with a one-off key"
          fi
          "$BT/zipalign" -f -P 16 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p ../../dist-android
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --out ../../dist-android/Tilsim-android.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose ../../dist-android/Tilsim-android.apk | head -5
          unzip -l ../../dist-android/Tilsim-android.apk | grep 'lib/'
          ls -la ../../dist-android
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: tilsim-android-apk
          path: dist-android/Tilsim-android.apk
          if-no-files-found: error

  publish:
    name: Publish test builds (GitHub Release "dev")
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core, api, api-worker, client, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Replace the "dev" pre-release with this commit's builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir upload
          cp artifacts/tilsim-windows-installer/*.exe upload/Tilsim-windows-setup.exe
          cp artifacts/tilsim-android-apk/Tilsim-android.apk upload/Tilsim-android.apk
          ls -la upload
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev upload/* --prerelease --target "$GITHUB_SHA" \
            --title "Tilsim — sinov versiyasi (${GITHUB_SHA::7})" \
            --notes "main branch'ning oxirgi muvaffaqiyatli build'i. Faqat sinov uchun: Windows o'rnatuvchisi imzolanmagan (SmartScreen ogohlantiradi), Android APK release build (arm64 + armv7)."
