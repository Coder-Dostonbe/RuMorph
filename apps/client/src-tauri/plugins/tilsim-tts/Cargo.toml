[package]
name = "tauri-plugin-tilsim-tts"
version = "0.1.0"
edition = "2021"
publish = false
description = "Zabon: read a Russian word aloud with Android's own text-to-speech (Android only)."
links = "tauri-plugin-tilsim-tts"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
