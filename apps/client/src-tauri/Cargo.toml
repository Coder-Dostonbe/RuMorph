[package]
name = "tilsim"
version = "0.1.0"
description = "Zabon — Russian for Uzbek speakers"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tilsim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Updates (src/update.rs). Windows: Tauri's updater installs a signed installer from the GitHub
# "dev" release. Android cannot replace an app silently: plugins/tilsim-update downloads the
# APK and opens the system installer.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-tilsim-update = { path = "plugins/tilsim-update" }
# Android's webview has no speechSynthesis: the phone's TTS reads words without a recording (src/tts.rs).
tauri-plugin-tilsim-tts = { path = "plugins/tilsim-tts" }

# The refresh token goes to Windows Credential Manager on Windows; other
# platforms keep it in a file inside the app's private data folder (secret.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
