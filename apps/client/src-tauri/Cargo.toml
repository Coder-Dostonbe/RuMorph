[package]
name = "tilsim"
version = "0.1.0"
description = "Tilsim — Russian for Uzbek speakers"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tilsim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"

# The refresh token goes to Windows Credential Manager on Windows; other
# platforms keep it in a file inside the app's private data folder (secret.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
